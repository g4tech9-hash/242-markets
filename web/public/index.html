<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>242 Markets | Bahamian Stock Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0f1a;
            color: white;
            overflow: hidden;
        }
        .glass {
            background: rgba(22, 27, 43, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .aquamarine-glow {
            box-shadow: 0 0 20px rgba(0, 206, 209, 0.2);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-screen w-screen flex">

    <!-- Watchlist Sidebar -->
    <aside class="w-80 glass h-full flex flex-col z-20">
        <div class="p-6 border-b border-white/10">
            <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                <span class="text-[#00ced1]">242</span> Markets
            </h1>
            <div class="mt-4 relative">
                <input type="text" placeholder="Search BISX..."
                    class="w-full bg-slate-900/50 border border-white/10 rounded-xl py-2 px-4 text-sm focus:outline-none focus:border-[#00ced1] transition-all">
            </div>
        </div>

        <div id="watchlist" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Assets injected here -->
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        <!-- Top Nav -->
        <header class="h-16 glass flex items-center justify-between px-8 z-10">
            <div class="flex items-center gap-2 text-xs font-medium text-slate-400">
                <span>Markets</span> <span class="text-slate-600">/</span>
                <span class="text-[#00ced1]">BISX</span> <span class="text-slate-600">/</span>
                <span id="active-ticker" class="text-white font-bold">LOADING...</span>
            </div>
            <div class="flex gap-2">
                <button class="px-3 py-1 rounded-md text-xs bg-slate-800 text-slate-300 border border-white/10 hover:bg-slate-700">1D</button>
                <button class="px-3 py-1 rounded-md text-xs bg-[#00ced1] text-white shadow-lg shadow-[#00ced1]/20">1W</button>
                <button class="px-3 py-1 rounded-md text-xs bg-slate-800 text-slate-300 border border-white/10 hover:bg-slate-700">1M</button>
            </div>
        </header>

        <!-- Chart Section -->
        <div class="flex-1 p-6 flex gap-6">
            <div class="flex-1 glass rounded-3xl relative overflow-hidden aquamarine-glow">
                <div id="chart-container" class="w-full h-full"></div>
            </div>

            <!-- Market Stats Panel -->
            <div class="w-72 glass rounded-3xl p-6 flex flex-col gap-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Market Stats</h3>

                <div class="space-y-4">
                    <div class="flex justify-between items-center p-4 rounded-2xl bg-slate-950/50 border border-white/5">
                        <span class="text-xs text-slate-500">Price</span>
                        <span id="stat-price" class="text-lg font-bold text-white">$0.00</span>
                    </div>
                    <div class="flex justify-between items-center p-4 rounded-2xl bg-slate-950/50 border border-white/5">
                        <span class="text-xs text-slate-500">Change</span>
                        <span id="stat-change" class="text-sm font-bold text-emerald-400">0.0%</span>
                    </div>
                    <div class="flex justify-between items-center p-4 rounded-2xl bg-slate-950/50 border border-white/5">
                        <span class="text-xs text-slate-500">Volume</span>
                        <span id="stat-volume" class="text-sm font-medium text-slate-300">0</span>
                    </div>
                </div>

                <div class="mt-auto">
                    <button class="w-full py-4 rounded-2xl bg-gradient-to-r from-[#00ced1] to-blue-600 text-white font-bold text-sm shadow-xl hover:brightness-110 transition-all active:scale-95">
                        Detailed Analysis
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const THEME = {
            background: '#0a0f1a',
            primary: '#00ced1',
            grid: '#1e293b',
            text: '#94a3b8'
        };

        const MOCK_ASSETS = [
            { ticker: 'BANA', name: 'Bahamas Bank', price: 12.45, change: 1.2 },
            { ticker: 'BPT', name: 'Bahamas Petroleum', price: 8.30, change: -0.5 },
            { ticker: 'SUNC', name: 'Sun City Real Estate', price: 45.10, change: 2.1 },
            { ticker: 'ISL', name: 'Island Logistics', price: 22.15, change: 0.8 },
        ];

        let chart;
        let candleSeries;

        function initChart() {
            const chartOptions = {
                layout: {
                    backgroundColor: '#0a0f1a',
                    textColor: '#94a3b8',
                },
                grid: {
                    vertLines: { color: THEME.grid },
                    horzLines: { color: THEME.grid },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: THEME.grid,
                },
                timeScale: {
                    borderColor: THEME.grid,
                },
            };

            chart = LightweightCharts.createChart(document.getElementById('chart-container'), chartOptions);
            candleSeries = chart.addCandlestickSeries({
                upColor: '#10b981',
                downColor: '#f43f5e',
                borderVisible: false,
                wickUpColor: '#10b981',
                wickDownColor: '#f43f5e',
            });

            const data = [
                { time: '2023-10-01', open: 10, high: 11, low: 9, close: 10.5 },
                { time: '2023-10-02', open: 10.5, high: 12, low: 10, close: 11.2 },
                { time: '2023-10-03', open: 11.2, high: 11.5, low: 10.8, close: 11 },
                { time: '2023-10-04', open: 11, high: 12.5, low: 11, close: 12.1 },
                { time: '2023-10-05', open: 12.1, high: 13, low: 12, close: 12.5 },
            ];
            candleSeries.setData(data);

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: document.getElementById('chart-container').clientWidth, height: document.getElementById('chart-container').clientHeight });
            });
        }

        function renderWatchlist() {
            const container = document.getElementById('watchlist');
            container.innerHTML = '';

            MOCK_ASSETS.forEach(asset => {
                const div = document.createElement('div');
                div.className = 'p-4 rounded-2xl cursor-pointer transition-all hover:bg-white/5 flex justify-between items-center group';
                div.innerHTML = `
                    <div>
                        <div class="text-white font-bold group-hover:text-[#00ced1] transition-colors">${asset.ticker}</div>
                        <div class="text-xs text-slate-500">${asset.name}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-white font-semibold">$${asset.price}</div>
                        <div class="text-xs ${asset.change >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                            ${asset.change >= 0 ? '▲' : '▼'} ${Math.abs(asset.change)}%
                        </div>
                    </div>
                `;
                div.onclick = () => selectAsset(asset);
                container.appendChild(div);
            });
        }

        function selectAsset(asset) {
            document.getElementById('active-ticker').innerText = asset.ticker;
            document.getElementById('stat-price').innerText = `$${asset.price}`;
            document.getElementById('stat-change').innerText = `${asset.change >= 0 ? '+' : ''}${asset.change}%`;
            document.getElementById('stat-change').className = `text-sm font-bold ${asset.change >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            const newData = Array.from({length: 20}, (_, i) => ({
                time: `2023-10-${(i+1).toString().padStart(2, '0')}`,
                open: Math.random() * 10 + 10,
                high: Math.random() * 10 + 15,
                low: Math.random() * 10 + 5,
                close: Math.random() * 10 + 10,
            }));
            candleSeries.setData(newData);
        }

        window.onload = () => {
            initChart();
            renderWatchlist();
            selectAsset(MOCK_ASSETS[0]);
        };
    </script>
</body>
</html>
