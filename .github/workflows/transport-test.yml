name: Transport channel test

on:
  push:
    branches: [ arena/b9ae89a0-242-markets ]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Probe push permission
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          date -u +%H%M%S > dist/push-probe.txt
          git add dist/push-probe.txt
          git diff --staged --quiet || git commit -m "Probe: workflow push permission [skip ci]"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::notice title=probe::PUSH OK"
          else
            echo "::notice title=probe::PUSH FAILED"
          fi
