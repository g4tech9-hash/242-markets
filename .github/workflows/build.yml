name: Build Android APK

on:
  push:
    branches: [ main, master, arena/** ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/extras || true
          echo "::notice title=disk::$(df -h / | tail -1)"
          echo "::notice title=mem::$(free -h | grep Mem)"

      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Report Flutter version
        run: |
          flutter --version 2>&1 | tee flutter-version.txt
          echo "::notice title=flutter version::$(head -n 1 flutter-version.txt)"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 242-markets-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/242-markets-release.apk
          git add dist/242-markets-release.apk
          git diff --staged --quiet || git commit -m "Build: publish release APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning title=publish::git push failed (workflow token may be read-only)"

      - name: Publish failure diagnostics
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            echo "::error title=build log::build.log not found"
            exit 0
          fi
          # Drop sdkmanager progress-bar spam, keep real output.
          tr '\r' '\n' < build.log | grep -vE '^\[[ =>]+\][ ]*[0-9]+%' > /tmp/clean.log || true
          echo "::notice title=lines::clean=$(wc -l < /tmp/clean.log) raw=$(wc -l < build.log)"
          {
            echo "### build log (cleaned tail)"
            echo '```'
            tail -n 120 /tmp/clean.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -iE 'error|exception|failed|what went wrong|caused by|fatal|no space|killed' /tmp/clean.log | tail -n 30 > /tmp/err.log || true
          for f in /tmp/err.log; do
            if [ -s "$f" ]; then
              msg=$(sed ':a;N;$!ba;s/\n/%0A/g; s/%/%25/g; s/\r/%0D/g' "$f")
              echo "::error title=possible errors::${msg}"
            fi
          done
          tail -n 120 /tmp/clean.log | sed 's/%/%25/g; s/\r/%0D/g' | split -l 12 - /tmp/alog_
          for f in /tmp/alog_*; do
            msg=$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")
            echo "::error title=build log::${msg}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          cp build.log dist/build-failure.log
          tr '\r' '\n' < build.log | grep -vE '^\[[ =>]+\][ ]*[0-9]+%' > dist/build-failure-clean.log || true
          git add dist/build-failure.log dist/build-failure-clean.log
          git diff --staged --quiet || git commit -m "Build: record build failure log [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning title=publish::git push failed (workflow token may be read-only)"
