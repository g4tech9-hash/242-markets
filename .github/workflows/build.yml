name: Build Android APK

on:
  push:
    branches: [ main, master, arena/** ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 242-markets-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/242-markets-release.apk
          git add dist/242-markets-release.apk
          git diff --staged --quiet || git commit -m "Build: publish release APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish failure log to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          cp build.log dist/build-failure.log
          git add dist/build-failure.log
          git diff --staged --quiet || git commit -m "Build: record build failure log [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
